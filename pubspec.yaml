name: ashgledger
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  provider: ^6.1.5+1
  dio: ^5.10.0
  pretty_dio_logger: ^1.4.0
  get_it: ^9.2.1
  json_annotation: ^4.12.0
  flutter_slidable: ^4.0.3
  shimmer: ^3.0.0
  shared_preferences: ^2.5.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  json_serializable: ^6.14.0
  freezed: ^3.2.5
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_logo/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D472B"
  adaptive_icon_foreground: "assets/app_logo/app_logo.png"
  web:
    generate: true
    image_path: "assets/app_logo/app_logo.png"
  windows:
    generate: true
    image_path: "assets/app_logo/app_logo.png"
  macos:
    generate: true
    image_path: "assets/app_logo/app_logo.png"
  linux:
    generate: true
    image_path: "assets/app_logo/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo/
